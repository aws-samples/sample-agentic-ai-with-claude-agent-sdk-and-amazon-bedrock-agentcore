[project]
# Dependencies for the DEPLOYED agent (installed inside the AgentCore container).
# Kept minimal: the agent runtime + the AgentCore wrapper + OTel export.
name = "chief-of-staff-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "mcp==1.29.0",                        # kept at 1.x: mcp 2.0 broke create_sdk_mcp_server on SDK 0.2.88; not re-tested with mcp 2.x on SDK 0.2.168
    "bedrock-agentcore==1.13.0",
    "aws-opentelemetry-distro==0.17.1",   # opentelemetry-instrument wrapper used by AgentCore (enableOtel)
    "openinference-instrumentation-claude-agent-sdk==0.1.5",
    "python-dotenv==1.2.2",
    "boto3==1.43.21",
]
