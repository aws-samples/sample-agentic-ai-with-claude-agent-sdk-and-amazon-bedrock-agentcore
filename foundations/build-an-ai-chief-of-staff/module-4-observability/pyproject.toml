[project]
name = "module-4-observability"
version = "0.1.0"
description = "Workshop Module 4 — Add AgentCore Observability (view agent traces in CloudWatch GenAI Observability)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.88",           # same agent runtime as Modules 1 & 2
    "bedrock-agentcore==1.13.0",          # BedrockAgentCoreApp + @app.entrypoint
    "aws-opentelemetry-distro==0.17.1",   # ADOT — the runtime auto-instruments with this
    "python-dotenv==1.2.2",
    "boto3==1.43.21",                     # invoke helper, Transaction Search, /aws/spans peek
    "ipykernel==7.2.0",                   # notebook kernel
    "openinference-instrumentation-claude-agent-sdk==0.1.5"   # auto-emits agent/tool spans → see inside the agent in the trace
]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "nbclient==0.10.4",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "chief_of_staff_agent"]
markers = [
    "slow: deploys/invokes against AWS AgentCore + waits for traces (needs creds; minutes + cost)",
]
addopts = "-m 'not slow'"
