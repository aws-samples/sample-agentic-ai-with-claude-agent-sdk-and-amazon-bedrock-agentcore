[project]
name = "module-3-memory"
version = "0.1.0"
description = "Workshop Module 3 — Give the deployed Chief of Staff agent cross-session memory via Amazon Bedrock AgentCore Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.88",       # same agent runtime as Module 1
    "bedrock-agentcore==1.13.0",      # BedrockAgentCoreApp + @app.entrypoint
    "aws-opentelemetry-distro==0.17.1",  # provides `opentelemetry-instrument` (AgentCore wraps the entrypoint with it)
    "python-dotenv==1.2.2",
    "boto3==1.43.21",                 # AgentCore Memory data plane (create_event / retrieve / list) + invoke helper
    "ipykernel==7.2.0",               # notebook kernel
]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "nbclient==0.10.4",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "chief_of_staff_agent"]
markers = [
    "slow: deploys/invokes against AWS AgentCore (needs creds + Docker; minutes + cost)",
]
addopts = "-m 'not slow'"
