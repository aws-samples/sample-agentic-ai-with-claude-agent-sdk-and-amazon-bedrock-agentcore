[project]
name = "student-analytics-agent"
version = "0.1.0"
description = "AI agent for analyzing student management data using Claude Agent SDK and Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = "==3.14.*"
license = {text = "MIT"}
authors = [
    {name = "Student Analytics Agent Demo"}
]
keywords = ["ai", "agent", "claude", "bedrock", "agentcore", "analytics", "athena"]

dependencies = [
    "claude-agent-sdk==0.1.19",
    "anyio>=3.7.0",
    "python-dotenv>=1.0.0",
    "bedrock-agentcore==1.1.4",
    "boto3>=1.34.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[dependency-groups]
dev = []

[tool.black]
line-length = 100
target-version = ['py314']

[tool.ruff]
line-length = 100
target-version = "py314"
