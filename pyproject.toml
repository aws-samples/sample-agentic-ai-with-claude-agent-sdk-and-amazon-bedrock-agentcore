[project]
name = "claude-agentcore-workshop"
version = "0.1.0"
description = "Workshop: Build Agentic AI Applications with Claude Agent SDK and Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AWS Workshop"}
]
keywords = ["ai", "agent", "claude", "bedrock", "agentcore", "workshop"]

dependencies = [
    "claude-agent-sdk==0.1.27",
    "anyio==4.12.1",
    "python-dotenv==1.2.1",
    "bedrock-agentcore==1.1.4",
    "bedrock-agentcore-starter-toolkit==0.2.9",
    "boto3==1.42.40",
    "pandas==3.0.0",
    "numpy==2.4.2",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "faker==40.1.2",
    "sqlparse==0.5.5",
    "jupyter==1.1.1",
    "ipykernel==7.1.0",
    "aws-opentelemetry-distro==0.14.2",
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "openinference-instrumentation-bedrock==0.1.32",
    "openinference-semantic-conventions==0.1.26"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
