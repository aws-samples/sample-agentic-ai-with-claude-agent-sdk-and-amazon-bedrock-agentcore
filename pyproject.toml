[project]
name = "workshop"
version = "0.1.0"
description = "Agentic AI Workshop — unified environment (all modules)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.88",
    "bedrock-agentcore==1.13.0",
    "boto3==1.43.21",
    "python-dotenv==1.2.2",
    "ipykernel==7.2.0",
    "aws-opentelemetry-distro==0.17.1",
    "openinference-instrumentation-claude-agent-sdk==0.1.5",
    "sqlparse==0.5.5",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "nbclient==0.10.4",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
]
